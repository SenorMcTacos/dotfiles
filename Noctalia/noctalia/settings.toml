[shell]
font_family = "MesloLGL Nerd Font Mono"

[theme]
builtin = "Noctalia"
community_palette = "Catppuccin Macchiato Pink"
pure_black_dark = true
source = "community"
wallpaper_scheme = "m3-tonal-spot"

[wallpaper.default]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[weather]
unit = "imperial"

[widget.active_window]
max_length = 180
title_scroll = "on_hover"

[widget.battery]
display_mode = "graphic"

[widget.clock]
color = "primary"
scale = 0.90000000000000002

[widget.media]
max_length = 190
title_scroll = "always"

[widget.network]
color = "primary"

[widget.spacer_1]
length = 10

[widget.spacer_2]
enabled = true
length = 10
type = "spacer"

[widget.sysmon_2]
show_value = true

[widget.sysmon_3]
visualization = "graph"

[widget.temp]
show_value = true

[widget.tray]
scale = 1.0

[widget.volume]
color = "primary"

[widget.workspaces]
empty_color = "on_surface_variant"
show_labels = true
style = "minimal"